<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>My First Web Page</title>
	<style>
		:root {
			color-scheme: light;
			--navy: #18324b;
			--blue: #2874a6;
			--paper: #f1f4f7;
			--gray: #5d6873;
		}

		* {
			box-sizing: border-box;
		}

		body {
			margin: 0;
			background: var(--paper);
			color: var(--gray);
			font-family: Georgia, "Times New Roman", serif;
		}

		header {
			padding: 24px max(7vw, 24px);
			border-top: 5px solid var(--blue);
			background: var(--navy);
			color: #fff;
			font-family: Arial, sans-serif;
			font-size: 13px;
			font-weight: 700;
			letter-spacing: 1.5px;
			text-transform: uppercase;
		}

		main {
			max-width: 860px;
			margin: 0 auto;
			padding: clamp(56px, 12vw, 120px) 24px;
		}

		h1 {
			max-width: 680px;
			margin: 0 0 20px;
			color: var(--navy);
			font-size: clamp(36px, 7vw, 60px);
			font-weight: 400;
			line-height: 1.1;
		}

		p {
			max-width: 560px;
			margin: 0;
			font-family: Arial, sans-serif;
			font-size: 17px;
			line-height: 1.7;
		}

		.accent {
			width: 56px;
			height: 3px;
			margin: 28px 0;
			background: var(--blue);
		}
	</style>
</head>
<body>
	<header>Consulting</header>
	<main>
		<h1>Welcome to My Web Page</h1>
		<div class="accent" aria-hidden="true"></div>
		<p>This is a basic HTML page.</p>
	</main>
</body>
</html>
